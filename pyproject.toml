[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deconrnaseq-py"
version = "1.50.0"
description = "Fast, R-free Python re-implementation of Bioconductor DeconRNASeq 1.50.0: RNA-seq mixture deconvolution by constrained least squares."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-only"
authors = [{ name = "deconrnaseq-py contributors" }]
maintainers = [{ name = "LCGaoZzz" }]
keywords = ["rna-seq", "deconvolution", "constrained-least-squares", "cell-type-proportions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
test = ["pytest>=7"]
# Optional compiled backend; a prebuilt wheel is shipped separately and the
# pure-Python solver remains the default fallback when it is absent.
rust = ["deconrnaseq-rust"]

[project.urls]
Homepage = "https://github.com/LCGaoZzz/deconrnaseq-py"
Repository = "https://github.com/LCGaoZzz/deconrnaseq-py"
Issues = "https://github.com/LCGaoZzz/deconrnaseq-py/issues"
"Upstream R package" = "https://bioconductor.org/packages/DeconRNASeq"
"Original source" = "https://bioconductor.org/packages/3.21/bioc/src/contrib/DeconRNASeq_1.50.0.tar.gz"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deconrnaseq = ["py.typed"]
