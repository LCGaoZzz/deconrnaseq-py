[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "deconrnaseq-rust"
version = "1.50.0"
description = "Optional Rust acceleration backend for deconrnaseq-py."
requires-python = ">=3.9"
license = "GPL-2.0-only"
authors = [{ name = "deconrnaseq-py contributors" }]
keywords = ["rna-seq", "deconvolution", "rust", "pyo3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/LCGaoZzz/deconrnaseq-py"
Repository = "https://github.com/LCGaoZzz/deconrnaseq-py"

[tool.maturin]
bindings = "pyo3"
manifest-path = "Cargo.toml"
module-name = "deconrnaseq_rust"
